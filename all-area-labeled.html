<style>

  #mapcard {

    background:var(--panel-bg); box-shadow:0 2px 10px rgba(0,0,0,.08);

  }

  #controls {
    flex:0 0 auto; display:flex; gap:10px; padding:14px;
  }
  .ctl-btn {
    background:#fff; border:1.5px solid var(--accent-border); border-radius:14px;
    color:var(--teal-dark); font-weight:800; font-size:20px;
    width:56px; height:56px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; user-select:none;
  }
  .ctl-btn:active { background:#e6efed; }
  #fitBtn {
    width:auto; padding:0 18px; font-size:15px; white-space:nowrap;
  }

  #mapwrap { flex:1 1 auto; position:relative; min-height:0; }
  #map { position:absolute; inset:0; background:var(--map-void); }
  .leaflet-container { background:var(--map-void); }
  .leaflet-control-attribution { display:none; }

  .town-label {
    background:transparent !important; border:none !important; box-shadow:none !important;
    color:var(--label-color); font-weight:600; white-space:nowrap; pointer-events:none;
  }
  .leaflet-tooltip-pane { z-index:650; }

  #footer {
    flex:0 0 auto; padding:6px 16px 14px; color:#7f9491; font-size:10.5px; line-height:1.6; text-align:left;

  });
  label.addTo(layerGroup);
});

const bounds = L.latLngBounds(allBounds);
map.fitBounds(bounds, { padding: [16, 16] });

document.getElementById('zoomIn').addEventListener('click', () => map.zoomIn());
document.getElementById('zoomOut').addEventListener('click', () => map.zoomOut());
document.getElementById('fitBtn').addEventListener('click', () => {
  map.fitBounds(bounds, { padding: [16, 16] });
});

function updateLabelSize() {
  const z = map.getZoom();
  const size = Math.max(8, Math.min(14, 7 + (z - 12) * 1.5));
  document.querySelectorAll('.town-label span').forEach(el => {
    el.style.fontSize = size + 'px';
  });
}
map.on('zoomend', updateLabelSize);
updateLabelSize();
</script>
</body>
</html>
